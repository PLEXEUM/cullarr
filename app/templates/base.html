<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Cullarr</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Theme Variables - Matching Cullarr existing colors */
        [data-theme="dark"] {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border-color: #334155;
            --accent: #6366f1;
            --accent-rgb: 99, 102, 241;
            --success: #10b981;
            --success-bg: rgba(16, 185, 129, 0.15);
            --danger: #ef4444;
            --danger-bg: rgba(239, 68, 68, 0.15);
            --queue: #3b82f6;
            --queue-bg: rgba(59, 130, 246, 0.15);
            --warning: #f59e0b;
            --warning-bg: rgba(245, 158, 11, 0.15);
            --info: #3b82f6;
            --info-bg: rgba(59, 130, 246, 0.15);
            --purple: #a78bfa;
            --purple-bg: rgba(139, 92, 246, 0.15);
            --star: #f5c518;
        }
        
        [data-theme="light"] {
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --accent: #6366f1;
            --accent-rgb: 99, 102, 241;
            --success: #059669;
            --success-bg: rgba(5, 150, 105, 0.1);
            --danger: #dc2626;
            --danger-bg: rgba(220, 38, 38, 0.1);
            --queue: #2563eb;
            --queue-bg: rgba(37, 99, 235, 0.1);
            --warning: #d97706;
            --warning-bg: rgba(217, 119, 6, 0.1);
            --info: #2563eb;
            --info-bg: rgba(37, 99, 235, 0.1);
            --purple: #7c3aed;
            --purple-bg: rgba(124, 58, 237, 0.1);
            --star: #eab308;
        }
        
        * {
            transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
        }
        
        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
        }
        
        /* Layout: Desktop sidebar + main content */
        .app-container {
            display: flex;
            min-height: 100vh;
        }
        
        /* Sidebar - Desktop */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 260px;
            height: 100vh;
            background-color: var(--bg-card);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            z-index: 40;
            transform: translateX(0);
            transition: transform 0.2s ease;
        }
        
        /* Sidebar - Mobile (hidden by default) */
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
            }
            .sidebar.open {
                transform: translateX(0);
                box-shadow: 4px 0 20px rgba(0, 0, 0, 0.3);
            }
        }
        
        /* Sidebar backdrop (mobile only) */
        .sidebar-backdrop {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 39;
        }
        
        .sidebar-backdrop.open {
            display: block;
        }
        
        @media (min-width: 769px) {
            .sidebar-backdrop {
                display: none !important;
            }
        }
        
        /* Main content - Desktop (pushes right to accommodate sidebar) */
        .main-content {
            flex: 1;
            margin-left: 260px;
            width: calc(100% - 260px);
        }
        
        /* Main content - Mobile (full width) */
        @media (max-width: 768px) {
            .main-content {
                margin-left: 0;
                width: 100%;
            }
        }
        
        /* Top bar (mobile only - contains hamburger) */
        .mobile-top-bar {
            display: none;
            position: sticky;
            top: 0;
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            padding: 0.75rem 1rem;
            align-items: center;
            justify-content: space-between;
            z-index: 35;
        }
        
        @media (max-width: 768px) {
            .mobile-top-bar {
                display: flex;
            }
        }
        
        /* Desktop top bar area (just a spacer) */
        .desktop-top-spacer {
            display: block;
        }
        
        @media (max-width: 768px) {
            .desktop-top-spacer {
                display: none;
            }
        }
        
        /* Hamburger button */
        .hamburger {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 0.5rem;
            color: var(--text-primary);
            font-size: 1.5rem;
            line-height: 1;
        }
        
        .hamburger:hover {
            background: var(--purple-bg);
        }
        
        /* Sidebar logo area */
        .sidebar-logo {
            padding: 1.5rem 1rem 1rem 1.5rem;
            font-size: 1.25rem;
            font-weight: bold;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 0.5rem;
        }
        
        .sidebar-logo span {
            color: var(--accent);
        }
        
        /* Sidebar navigation */
        .sidebar-nav {
            flex: 1;
            padding: 0.5rem 0.75rem;
        }
        
        .nav-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.625rem 0.875rem;
            border-radius: 0.5rem;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.2s ease;
            margin-bottom: 0.25rem;
        }
        
        .nav-item:hover {
            background: var(--purple-bg);
            color: var(--text-primary);
        }
        
        .nav-item.active {
            background: var(--purple-bg);
            color: var(--accent);
        }
        
        /* Sidebar footer (theme toggle area) */
        .sidebar-footer {
            padding: 1rem 0.75rem 1.5rem 0.75rem;
            border-top: 1px solid var(--border-color);
            margin-top: auto;
        }
        
        .theme-toggle {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.625rem 0.875rem;
            border-radius: 0.5rem;
            cursor: pointer;
            width: 100%;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 0.875rem;
        }
        
        .theme-toggle:hover {
            background: var(--purple-bg);
            color: var(--text-primary);
        }
        
        /* Card styles (existing, kept unchanged) */
        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            overflow: hidden;
        }
        
        .card-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-secondary);
        }
        
        .card-header-icon {
            width: 1.25rem;
            height: 1.25rem;
            color: var(--accent);
        }
        
        .card-header-title {
            font-weight: 600;
            font-size: 1rem;
        }
        
        .card-header-subtitle {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }
        
        /* Toast */
        .toast {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            z-index: 9999;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        /* Button styles */
        .btn-raise {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
        }
        
        .btn-raise:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px -4px rgba(0, 0, 0, 0.3);
        }
        
        .btn-sm {
            padding: 0.375rem 0.75rem;
            font-size: 0.75rem;
            border-radius: 0.5rem;
            transition: all 0.2s ease;
            cursor: pointer;
        }
        
        .btn-outline {
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            background: transparent;
        }
        
        .btn-outline:hover {
            border-color: var(--accent);
            color: var(--accent);
        }
        
        .btn-danger {
            border: 1px solid var(--danger);
            color: var(--danger);
            background: transparent;
        }
        
        .btn-danger:hover {
            background: var(--danger-bg);
        }
        
        /* Badge styles */
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 0.25rem 0.5rem;
            border-radius: 0.375rem;
            font-size: 0.75rem;
            font-weight: 500;
        }
        
        .badge-success { background: var(--success-bg); color: var(--success); }
        .badge-danger { background: var(--danger-bg); color: var(--danger); }
        .badge-info { background: var(--info-bg); color: var(--info); }
        
        /* Status dot */
        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
        }
        .status-connected { background: #10b981; }
        .status-error { background: #ef4444; }
        .status-unknown { background: #94a3b8; }
        
        /* Progress bar */
        .progress-indeterminate {
            position: relative;
            overflow: hidden;
            background: var(--border-color) !important;
        }
        
        .progress-indeterminate::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            width: 40%;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            animation: shimmer 1.2s ease-in-out infinite;
            pointer-events: none;
        }
        
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(300%); }
        }
        
        /* Poster grid styles (existing, unchanged) */
        .poster-grid-container {
            padding: 1rem;
            overflow-x: auto;
        }
        
        .poster-grid {
            display: grid;
            grid-template-columns: repeat(6, minmax(150px, 1fr));
            gap: 1rem;
        }
        
        @media (max-width: 1400px) {
            .poster-grid { grid-template-columns: repeat(5, minmax(140px, 1fr)); }
        }
        @media (max-width: 1100px) {
            .poster-grid { grid-template-columns: repeat(4, minmax(140px, 1fr)); }
        }
        @media (max-width: 800px) {
            .poster-grid { grid-template-columns: repeat(3, minmax(130px, 1fr)); }
        }
        @media (max-width: 550px) {
            .poster-grid { grid-template-columns: repeat(2, minmax(120px, 1fr)); }
        }
        
        .poster-card {
            display: flex;
            flex-direction: column;
            background: var(--bg-card);
            border-radius: 0.5rem;
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
        }
        
        .poster-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px -6px rgba(0, 0, 0, 0.3);
        }
        
        .poster-image-container {
            position: relative;
            aspect-ratio: 2 / 3;
            overflow: hidden;
            background: var(--bg-secondary);
        }
        
        .poster-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .poster-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        
        .poster-image-container:hover .poster-overlay {
            opacity: 1;
        }
        
        .details-overlay-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-size: 0.75rem;
            cursor: pointer;
        }
        
        .countdown-badge {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.75);
            color: white;
            font-size: 0.7rem;
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            white-space: nowrap;
        }
        
        .poster-meta-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem;
            background: var(--bg-card);
            border-top: 1px solid var(--border-color);
        }
        
        .score-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.25rem 0.5rem;
            border-radius: 0.375rem;
            font-size: 0.75rem;
            font-weight: 600;
            min-width: 40px;
        }
        
        .score-high { background: #ef4444; color: white; }
        .score-medium { background: #eab308; color: white; }
        .score-low { background: #22c55e; color: white; }
        .badge-manual { background: #3b82f6; color: white; }
        
        .queue-btn, .remove-btn {
            padding: 0.25rem 0.5rem;
            border-radius: 0.375rem;
            font-size: 0.7rem;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid;
            background: transparent;
        }
        
        .queue-btn {
            border-color: var(--accent);
            color: var(--accent);
        }
        
        .queue-btn:hover {
            background: var(--accent);
            color: white;
        }
        
        .remove-btn {
            border-color: var(--danger);
            color: var(--danger);
        }
        
        .remove-btn:hover {
            background: var(--danger);
            color: white;
        }
        
        /* Table wrapper for horizontal scroll on mobile */
        .table-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        
        /* Hide scrollbar on mobile tables if desired */
        @media (max-width: 768px) {
            .table-wrapper table {
                min-width: 600px;
            }
        }
    
        /* ===== MOBILE MEDIA QUERIES ===== */
        
        /* Hide per-page dropdown on mobile */
        @media (max-width: 768px) {
            .score-queue-perpage {
                display: none;
            }
            
            /* Make search input full width on mobile */
            .score-queue-search-wrapper {
                width: 100%;
            }
        }

        /* ===== PHASE 2: SIDEBAR STATUS DOTS ===== */
        .sidebar-status {
            padding: 0.75rem 0.75rem;
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            margin: 0.5rem 0;
        }
        
        .status-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.375rem 0.5rem;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }
        
        .status-item .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 0;
        }
        
        .status-item .status-text {
            font-size: 0.75rem;
        }
        
        /* ===== PHASE 2: SIDEBAR PROGRESS (appears during runs) ===== */
        .sidebar-progress {
            padding: 0.75rem;
            margin: 0.5rem 0;
            background: var(--bg-secondary);
            border-radius: 0.5rem;
        }
        
        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--accent);
        }
        
        .cancel-btn-sidebar {
            background: none;
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 0.25rem 0.5rem;
            border-radius: 0.375rem;
            font-size: 0.65rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .cancel-btn-sidebar:hover {
            background: var(--danger-bg);
        }
        
        .progress-bar-container {
            width: 100%;
            height: 4px;
            background: var(--border-color);
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 0.5rem;
        }
        
        .progress-bar-sidebar {
            width: 100%;
            height: 100%;
            background: var(--accent);
        }
        
        .progress-text {
            font-size: 0.65rem;
            color: var(--text-secondary);
            text-align: center;
        }
    
    </style>

</head>
<body>

<div class="app-container">
    <!-- Sidebar Backdrop (mobile only) -->
    <div id="sidebar-backdrop" class="sidebar-backdrop" onclick="closeSidebar()"></div>
    
    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar">
        <div class="sidebar-logo">
            <span>🗑</span> Cullarr
        </div>
        
        <nav class="sidebar-nav">
            <a href="/" class="nav-item" id="nav-dashboard">📊 Dashboard</a>
            <a href="/settings" class="nav-item" id="nav-settings">⚙️ Settings</a>
            <a href="/logs" class="nav-item" id="nav-logs">📜 Logs</a>
        </nav>
        
        <!-- Status Dots Container (Phase 2) -->
        <div id="sidebar-status" class="sidebar-status">
            <div class="status-item" id="radarr-status-sidebar">
                <span class="status-dot" id="radarr-status-dot-sidebar"></span>
                <span class="status-text" id="radarr-status-text-sidebar">Radarr</span>
            </div>
            <div class="status-item" id="plex-status-sidebar">
                <span class="status-dot" id="plex-status-dot-sidebar"></span>
                <span class="status-text" id="plex-status-text-sidebar">Plex</span>
            </div>
        </div>
        
        <!-- Progress Container (appears only during runs) -->
        <div id="sidebar-progress" class="sidebar-progress" style="display: none;">
            <div class="progress-header">
                <span id="progress-title">Score Run</span>
                <button id="cancel-run-sidebar" class="cancel-btn-sidebar">Cancel</button>
            </div>
            <div class="progress-bar-container">
                <div id="progress-bar-sidebar" class="progress-bar-sidebar progress-indeterminate"></div>
            </div>
            <div class="progress-text" id="progress-text-sidebar">Starting...</div>
        </div>
        
        <div class="sidebar-footer">
            <button onclick="toggleTheme()" class="theme-toggle">
                🌙 Theme
            </button>
        </div>
    </aside>
    
    <!-- Main Content Area -->
    <main class="main-content">
        <!-- Mobile Top Bar (hamburger + optional logo) -->
        <div class="mobile-top-bar">
            <button class="hamburger" onclick="toggleSidebar()">☰</button>
        </div>
        
        <!-- Desktop spacer (empty) -->
        <div class="desktop-top-spacer"></div>
        
        <!-- Page Content -->
        <div class="max-w-7xl mx-auto px-4 sm:px-6 py-6 sm:py-8">
            {% block content %}{% endblock %}
        </div>
    </main>
</div>

<!-- Toast Container -->
<div id="toast-container"></div>

<script>
    // Theme toggle
    function toggleTheme() {
        const html = document.documentElement;
        const current = html.getAttribute('data-theme');
        const next = current === 'dark' ? 'light' : 'dark';
        html.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
    }
    
    // Load saved theme
    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    
    // Sidebar toggle functions
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        const backdrop = document.getElementById('sidebar-backdrop');
        sidebar.classList.toggle('open');
        if (backdrop) backdrop.classList.toggle('open');
        document.body.style.overflow = sidebar.classList.contains('open') ? 'hidden' : '';
    }
    
    function closeSidebar() {
        const sidebar = document.getElementById('sidebar');
        const backdrop = document.getElementById('sidebar-backdrop');
        sidebar.classList.remove('open');
        if (backdrop) backdrop.classList.remove('open');
        document.body.style.overflow = '';
    }
    
    // Close sidebar when clicking a nav link (on mobile)
    document.querySelectorAll('.nav-item').forEach(link => {
        link.addEventListener('click', () => {
            if (window.innerWidth <= 768) {
                closeSidebar();
            }
        });
    });
    
    // Handle window resize - close sidebar if resizing from mobile to desktop
    window.addEventListener('resize', () => {
        if (window.innerWidth > 768) {
            closeSidebar();
        }
    });
    
    // Set active nav item based on current path
    function setActiveNav() {
        const path = window.location.pathname;
        document.getElementById('nav-dashboard')?.classList.toggle('active', path === '/');
        document.getElementById('nav-settings')?.classList.toggle('active', path === '/settings');
        document.getElementById('nav-logs')?.classList.toggle('active', path === '/logs');
    }
    setActiveNav();
    
    // Toast function
    function showToast(message, type = 'success', duration = 5000) {
        const colors = {
            success: 'bg-green-800 border-green-600 text-green-100',
            error: 'bg-red-800 border-red-600 text-red-100',
            warning: 'bg-yellow-800 border-yellow-600 text-yellow-100',
            info: 'bg-blue-800 border-blue-600 text-blue-100'
        };
        const toast = document.createElement('div');
        toast.className = `toast card border rounded-lg px-4 py-3 text-sm ${colors[type] || colors.info}`;
        toast.textContent = message;
        document.getElementById('toast-container').appendChild(toast);
        setTimeout(() => toast.remove(), duration);
    }

    // ===== PHASE 2: SIDEBAR PROGRESS FUNCTIONS =====
    function showSidebarProgress(title, text) {
        const progressContainer = document.getElementById('sidebar-progress');
        const progressTitle = document.getElementById('progress-title');
        const progressText = document.getElementById('progress-text-sidebar');
        const progressBar = document.getElementById('progress-bar-sidebar');
        
        if (progressContainer) {
            progressContainer.style.display = 'block';
            if (progressTitle) progressTitle.textContent = title;
            if (progressText) progressText.textContent = text;
            // Ensure indeterminate animation is applied
            if (progressBar) {
                progressBar.classList.add('progress-indeterminate');
            }
        }
    }
    
    function hideSidebarProgress() {
        const progressContainer = document.getElementById('sidebar-progress');
        if (progressContainer) {
            progressContainer.style.display = 'none';
        }
    }
    
    function updateSidebarProgressText(text) {
        const progressText = document.getElementById('progress-text-sidebar');
        if (progressText) {
            progressText.textContent = text;
        }
    }
    
    // ===== PHASE 2: SIDEBAR STATUS DOTS UPDATES =====
    function updateSidebarRadarrStatus(configured, status) {
        const dot = document.getElementById('radarr-status-dot-sidebar');
        const text = document.getElementById('radarr-status-text-sidebar');
        if (!dot || !text) return;
        
        if (configured && status === 'connected') {
            dot.className = 'status-dot status-connected';
            text.textContent = 'Radarr';
        } else if (configured && status === 'error') {
            dot.className = 'status-dot status-error';
            text.textContent = 'Radarr (error)';
        } else {
            dot.className = 'status-dot status-unknown';
            text.textContent = 'Radarr (not configured)';
        }
    }
    
    function updateSidebarPlexStatus(configured, status, details = '') {
        const dot = document.getElementById('plex-status-dot-sidebar');
        const text = document.getElementById('plex-status-text-sidebar');
        if (!dot || !text) return;
        
        if (configured && status === 'connected') {
            dot.className = 'status-dot status-connected';
            text.textContent = 'Plex';
        } else if (configured && status === 'error') {
            dot.className = 'status-dot status-error';
            text.textContent = 'Plex (error)';
        } else {
            dot.className = 'status-dot status-unknown';
            text.textContent = 'Plex (not configured)';
        }
    }

</script>

{% block scripts %}{% endblock %}
</body>
