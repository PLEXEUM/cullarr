{% extends "base.html" %}

{% block content %}
<div class="space-y-6">

    <!-- Header -->
    <div>
        <h1 class="text-2xl font-bold">Logs</h1>
        <p class="text-sm mt-1" style="color: var(--text-secondary)">
            View and manage application logs
        </p>
    </div>

    <!-- Log Settings (Collapsible) -->
    <div class="card rounded-xl overflow-hidden">
        <button onclick="toggleLogSettings()" class="w-full flex items-center justify-between p-4 text-left">
            <div class="flex items-center gap-3">
                <svg class="w-5 h-5" style="color: var(--accent);" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                </svg>
                <div>
                    <h2 class="font-semibold">Log Settings</h2>
                    <p class="text-xs" style="color: var(--text-secondary);">Configure log level and rotation</p>
                </div>
            </div>
            <svg id="log-settings-icon" class="w-5 h-5 transition-transform transform rotate-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
            </svg>
        </button>
        <div id="log-settings-section" class="border-t p-4 space-y-4" style="border-color: var(--border-color); display: none;">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wide mb-2" style="color: var(--text-secondary);">
                        Log Level
                    </label>
                    <select id="log-level" class="w-full px-3 py-2 rounded-lg text-sm border">
                        <option value="DEBUG">DEBUG - Everything</option>
                        <option value="INFO">INFO - Normal operations</option>
                        <option value="WARNING">WARNING - Issues only</option>
                        <option value="ERROR">ERROR - Critical only</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wide mb-2" style="color: var(--text-secondary);">
                        Max File Size (MB)
                    </label>
                    <input id="log-max-size" type="number" min="1" max="100" value="10" class="w-full px-3 py-2 rounded-lg text-sm border">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wide mb-2" style="color: var(--text-secondary);">
                        Max Files to Keep
                    </label>
                    <input id="log-max-files" type="number" min="1" max="20" value="5" class="w-full px-3 py-2 rounded-lg text-sm border">
                </div>
            </div>
            <button id="save-log-settings" class="w-full py-2 rounded-lg text-sm font-medium text-white btn-raise" style="background: var(--accent);">
                Save Log Settings
            </button>
        </div>
    </div>

    <!-- Filter Controls -->
    <div class="card rounded-xl p-4 flex items-center justify-between flex-wrap gap-4">
        <div class="flex items-center gap-4">
            <div class="flex items-center gap-2">
                <label class="text-sm">Filter:</label>
                <select id="log-filter" class="px-3 py-1 rounded-lg text-sm border" style="background: var(--bg-primary); border-color: var(--border-color);">
                    <option value="ALL">All</option>
                    <option value="INFO">Info</option>
                    <option value="WARNING">Warning</option>
                    <option value="ERROR">Error</option>
                    <option value="DEBUG">Debug</option>
                </select>
            </div>
            <label class="flex items-center gap-2 cursor-pointer">
                <input type="checkbox" id="auto-scroll" checked class="accent-indigo-500">
                <span class="text-sm">Auto-scroll</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
                <input type="checkbox" id="auto-refresh-logs" checked class="accent-indigo-500">
                <span class="text-sm">Auto-refresh (5s)</span>
            </label>
        </div>
        <div class="flex items-center gap-2">
            <button id="refresh-logs-btn" class="btn-sm btn-outline">↻ Refresh</button>
            <a href="/api/logs/download" class="btn-sm btn-outline no-underline">⬇ Download</a>
            <button id="clear-logs-btn" class="btn-sm btn-danger">🗑 Clear Logs</button>
        </div>
    </div>

    <!-- Log Viewer -->
    <div class="card rounded-xl overflow-hidden">
        <div id="log-viewer" class="p-4 font-mono text-xs overflow-y-auto" style="height: 500px; background: var(--bg-primary);">
            <div id="log-content">Loading...</div>
        </div>
    </div>

    <p id="log-meta" class="text-xs" style="color: var(--text-secondary)"></p>

</div>

<!-- Clear Logs Dialog -->
<div id="clear-dialog" class="hidden fixed inset-0 flex items-center justify-center z-50" style="background: rgba(0,0,0,0.6)">
    <div class="card rounded-xl p-6 max-w-sm w-full mx-4">
        <h3 class="font-semibold mb-2">Clear Logs</h3>
        <p class="text-sm mb-6" style="color: var(--text-secondary)">
            This will permanently delete all log entries. Are you sure?
        </p>
        <div class="flex gap-3">
            <button id="confirm-clear-logs" class="flex-1 py-2 rounded-lg text-sm font-medium" style="background: #ef4444; color: white;">Clear</button>
            <button onclick="document.getElementById('clear-dialog').classList.add('hidden')" class="flex-1 py-2 rounded-lg text-sm border" style="border-color: var(--border-color);">Cancel</button>
        </div>
    </div>
</div>

<script>
    let allLines = [];
    let autoRefreshInterval = null;
    let isLoading = false;

    function toggleLogSettings() {
        const section = document.getElementById('log-settings-section');
        const icon = document.getElementById('log-settings-icon');
        if (section.style.display === 'none' || section.style.display === '') {
            section.style.display = 'block';
            icon.style.transform = 'rotate(180deg)';
        } else {
            section.style.display = 'none';
            icon.style.transform = 'rotate(0deg)';
        }
    }

    async function loadLogs() {
        // Guard against concurrent fetches from auto-refresh and manual refresh racing
        if (isLoading) return;
        isLoading = true;

        try {
            const res = await fetch('/api/logs');
            const data = await res.json();
            allLines = data.lines || [];
            filterLogs();
            document.getElementById('log-meta').textContent = `Showing ${data.showing} of ${data.total_lines} total lines`;
        } catch (e) {
            document.getElementById('log-content').textContent = 'Failed to load logs.';
        } finally {
            isLoading = false;
        }
    }

    function filterLogs() {
        const filter = document.getElementById('log-filter').value;
        if (!allLines || allLines.length === 0) {
            document.getElementById('log-content').innerHTML = '<span style="color: var(--text-secondary)">No log entries found.</span>';
            return;
        }
        const filtered = filter === 'ALL' ? allLines : allLines.filter(line => line.includes(`[${filter}]`));
        const content = document.getElementById('log-content');
        if (filtered.length === 0) {
            content.innerHTML = '<span style="color: var(--text-secondary)">No matching log entries.</span>';
            return;
        }
        content.innerHTML = filtered.map(line => {
            let color = 'var(--text-primary)';
            if (line.includes('[ERROR]')) color = '#f87171';
            else if (line.includes('[WARNING]')) color = '#fbbf24';
            else if (line.includes('[DEBUG]')) color = '#94a3b8';
            else if (line.includes('[INFO]')) color = '#86efac';
            const safeLine = line.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m] || m);
            return `<div style="color: ${color}; padding: 1px 0; white-space: pre-wrap; font-family: monospace; font-size: 12px;">${safeLine}</div>`;
        }).join('');
        if (document.getElementById('auto-scroll').checked) {
            const viewer = document.getElementById('log-viewer');
            if (viewer) viewer.scrollTop = viewer.scrollHeight;
        }
    }

    async function loadLogSettings() {
        try {
            const res = await fetch('/api/logs/settings');
            const data = await res.json();
            document.getElementById('log-level').value = data.log_level || 'INFO';
            document.getElementById('log-max-size').value = data.log_max_size_mb || 10;
            document.getElementById('log-max-files').value = data.log_max_files || 5;
        } catch (e) { console.error('Failed to load log settings:', e); }
    }

    async function saveLogSettings() {
        const payload = {
            log_level: document.getElementById('log-level').value,
            log_max_size_mb: parseInt(document.getElementById('log-max-size').value),
            log_max_files: parseInt(document.getElementById('log-max-files').value)
        };
        try {
            const res = await fetch('/api/logs/settings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (res.ok) showToast('Log settings saved', 'success');
            else showToast('Failed to save', 'error');
        } catch (e) { showToast('Error: ' + e.message, 'error'); }
    }

    function showClearDialog() {
        document.getElementById('clear-dialog').classList.remove('hidden');
    }

    async function clearLogs() {
        document.getElementById('clear-dialog').classList.add('hidden');
        try {
            const res = await fetch('/api/logs', { method: 'DELETE' });
            if (res.ok) { showToast('Logs cleared', 'success'); loadLogs(); }
            else showToast('Failed to clear logs', 'error');
        } catch (e) { showToast('Error: ' + e.message, 'error'); }
    }

    function startAutoRefresh() {
        if (autoRefreshInterval) clearInterval(autoRefreshInterval);
        autoRefreshInterval = setInterval(loadLogs, 5000);
    }

    function stopAutoRefresh() {
        if (autoRefreshInterval) {
            clearInterval(autoRefreshInterval);
            autoRefreshInterval = null;
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        loadLogs();
        loadLogSettings();
        document.getElementById('log-filter').addEventListener('change', filterLogs);
        document.getElementById('refresh-logs-btn').addEventListener('click', loadLogs);
        document.getElementById('clear-logs-btn').addEventListener('click', showClearDialog);
        document.getElementById('confirm-clear-logs').addEventListener('click', clearLogs);
        document.getElementById('save-log-settings').addEventListener('click', saveLogSettings);
        const autoRefreshCheckbox = document.getElementById('auto-refresh-logs');
        autoRefreshCheckbox.addEventListener('change', () => {
            if (autoRefreshCheckbox.checked) startAutoRefresh();
            else stopAutoRefresh();
        });
        if (autoRefreshCheckbox.checked) startAutoRefresh();
    });
</script>
{% endblock %}
